version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/coverage-v8"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
